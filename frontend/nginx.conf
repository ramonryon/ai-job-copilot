server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 3m;     # document uploads (API limit is 2 MB)

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_buffering off;          # keep chat streaming token by token
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
