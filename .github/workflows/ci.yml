name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -rf 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          # Surface failures as annotations so they show up on the pull request.
          grep -E "^(FAILED|ERROR)|Error:|error:" pytest-output.txt | head -20 | sed 's/^/::error::/'
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
