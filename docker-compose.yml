services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:8080
      DATA_DIR: /app/data
    volumes:
      - knowledge-data:/app/data
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  knowledge-data:
